<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mapademia — Federal Research Funding by State &amp; Institution</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --border: #232733;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px 8px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    padding: 16px 28px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .control-group { display: flex; align-items: center; gap: 10px; }
  .control-group label { font-size: 13px; color: var(--muted); }
  select, input[type=range] { accent-color: var(--accent); }
  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  #year-label { font-variant-numeric: tabular-nums; min-width: 4ch; font-size: 13px; }
  #content-wrap {
    display: flex;
    gap: 24px;
    padding: 12px 28px 28px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: flex-start;
  }
  #map-wrap { flex: 1 1 640px; min-width: 0; }
  #institutions-panel {
    flex: 0 0 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    max-height: 636px;
    overflow-y: auto;
  }
  #institutions-panel h2 {
    font-size: 14px;
    margin: 0 0 2px;
    font-weight: 600;
  }
  #institutions-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #institutions-subtitle button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    margin-left: 6px;
  }
  .inst-row {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    cursor: pointer;
  }
  .inst-row:hover { background: rgba(255,255,255,0.03); }
  .inst-row:last-child { border-bottom: none; }
  .inst-rank { color: var(--muted); min-width: 1.6em; }
  .inst-name-wrap { flex: 1; min-width: 0; }
  .inst-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst-loc { color: var(--muted); font-size: 11px; }
  .inst-amount { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .inst-awards { color: var(--muted); font-size: 11px; text-align: right; }
  #detail-back {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    margin-bottom: 8px;
  }
  .detail-name { font-size: 13.5px; font-weight: 600; }
  .detail-loc { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .detail-section-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 14px 0 6px;
  }
  .chart-caveat { font-size: 10.5px; color: var(--muted); font-style: italic; margin-top: 4px; }
  .field-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin: 3px 0; }
  .field-name { flex: 0 0 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field-bar-track { flex: 1; background: var(--border); border-radius: 3px; height: 8px; overflow: hidden; }
  .field-bar-fill { background: var(--accent); height: 100%; }
  .field-pct { flex: 0 0 3em; text-align: right; color: var(--muted); }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
  }
  #tooltip .amount { font-weight: 600; color: var(--accent); }
  .state { stroke: var(--bg); stroke-width: 0.75px; cursor: pointer; }
  .state:hover { stroke: var(--text); stroke-width: 1.5px; }
  .state.selected { stroke: var(--accent); stroke-width: 2px; }
  #legend { font-size: 12px; color: var(--muted); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>Federal Research Funding by State &amp; Institution</h1>
  <div class="subtitle">Phase 1 — grant obligations to recipients · USAspending.gov bulk data · click a state to drill in</div>
</header>

<div class="controls">
  <div class="control-group">
    <label for="agency-select">Agency</label>
    <select id="agency-select">
      <option value="__all__">All</option>
    </select>
  </div>
  <div class="control-group">
    <label for="year-range">Fiscal Year</label>
    <input type="range" id="year-range" min="2016" max="2026" value="2026" step="1">
    <span id="year-label">2026</span>
  </div>
  <div class="control-group" id="legend"></div>
</div>

<div id="content-wrap">
  <div id="map-wrap">
    <svg id="map" viewBox="0 0 960 600" style="width: 100%; height: auto;"></svg>
  </div>
  <div id="institutions-panel">
    <h2>Top Institutions</h2>
    <div id="institutions-subtitle"></div>
    <div id="institutions-list"></div>
  </div>
</div>

<div id="tooltip"></div>

<footer>Source: USAspending.gov Award Data Archive (grant-type prime awards, recipient state). Not adjusted for inflation.</footer>

<script src="https://unpkg.com/d3@7"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script>
(async function () {
  const [us, rows, institutionRows, outputRows, fieldMixRows] = await Promise.all([
    d3.json("data/us-states-10m.json"),
    d3.csv("data/funding_by_state_year_agency.csv", d3.autoType),
    d3.csv("data/funding_by_institution_year_agency.csv", d3.autoType),
    d3.csv("data/institution_output_by_year.csv", d3.autoType),
    d3.csv("data/institution_field_mix.csv", d3.autoType),
  ]);

  const states = topojson.feature(us, us.objects.states).features;
  const pad2 = (id) => String(id).padStart(2, "0");

  // institution rows carry postal state codes, not FIPS - derive the
  // crosswalk from the state aggregate rather than hardcoding one.
  const postalByFips = new Map(rows.map(d => [pad2(d.state_fips), d.state_code]));
  let selectedFips = null;
  let selectedUei = null;
  const TOP_N_INSTITUTIONS = 500; // must match aggregate.py's TOP_N_INSTITUTIONS

  const agencies = Array.from(new Set(rows.map(d => d.agency))).sort();
  const agencySelect = d3.select("#agency-select");
  agencySelect.selectAll("option.agency")
    .data(agencies)
    .join("option")
    .attr("class", "agency")
    .attr("value", d => d)
    .text(d => d);

  const years = Array.from(new Set(rows.map(d => d.fiscal_year))).sort((a, b) => a - b);
  const yearRange = document.getElementById("year-range");
  yearRange.min = years[0];
  yearRange.max = years[years.length - 1];
  yearRange.value = years[years.length - 1];
  document.getElementById("year-label").textContent = yearRange.value;

  const svg = d3.select("#map");
  const projection = d3.geoAlbersUsa().fitSize([960, 600], { type: "FeatureCollection", features: states });
  const path = d3.geoPath(projection);
  const tooltip = d3.select("#tooltip");

  const color = d3.scaleSequential(d3.interpolateBlues);

  const paths = svg.selectAll("path.state")
    .data(states)
    .join("path")
    .attr("class", "state")
    .attr("d", path)
    .on("mousemove", (event, d) => {
      const rec = current.get(pad2(d.id));
      const amount = rec ? rec.total_obligations : 0;
      const awards = rec ? rec.award_count : 0;
      tooltip
        .style("opacity", 1)
        .style("left", event.clientX + 14 + "px")
        .style("top", event.clientY + 14 + "px")
        .html(`<strong>${d.properties.name}</strong><br>
               <span class="amount">$${amount.toLocaleString(undefined, {maximumFractionDigits: 0})}</span><br>
               ${awards.toLocaleString()} awards`);
    })
    .on("mouseleave", () => tooltip.style("opacity", 0))
    .on("click", (event, d) => {
      const fips = pad2(d.id);
      selectedFips = selectedFips === fips ? null : fips;
      render();
    });

  let current = new Map();

  function render() {
    const year = +yearRange.value;
    const agency = agencySelect.property("value");
    document.getElementById("year-label").textContent = year;

    const filtered = rows.filter(d => d.fiscal_year === year && (agency === "__all__" || d.agency === agency));

    current = new Map();
    for (const d of filtered) {
      const key = pad2(d.state_fips);
      const prev = current.get(key) || { total_obligations: 0, award_count: 0 };
      current.set(key, {
        total_obligations: prev.total_obligations + d.total_obligations,
        award_count: prev.award_count + d.award_count,
      });
    }

    const max = d3.max(Array.from(current.values(), d => d.total_obligations)) || 1;
    color.domain([0, max]);

    paths.attr("fill", d => {
      const rec = current.get(pad2(d.id));
      return rec ? color(rec.total_obligations) : "#1a1d26";
    });
    paths.classed("selected", d => pad2(d.id) === selectedFips);

    d3.select("#legend").text(`Darker = more funding · max $${max.toLocaleString(undefined, {maximumFractionDigits: 0})}`);

    renderInstitutions(year, agency);
  }

  function renderInstitutions(year, agency) {
    if (selectedUei) {
      renderInstitutionDetail(selectedUei, agency);
      return;
    }

    const selectedPostal = selectedFips ? postalByFips.get(selectedFips) : null;
    const stateLabel = selectedFips
      ? states.find(s => pad2(s.id) === selectedFips)?.properties.name
      : null;

    const filtered = institutionRows.filter(d =>
      d.fiscal_year === year &&
      (agency === "__all__" || d.agency === agency) &&
      (!selectedPostal || d.state_code === selectedPostal)
    );

    const byUei = new Map();
    for (const d of filtered) {
      const prev = byUei.get(d.uei);
      if (prev) {
        prev.total_obligations += d.total_obligations;
        prev.award_count += d.award_count;
      } else {
        byUei.set(d.uei, { ...d });
      }
    }

    const ranked = Array.from(byUei.values()).sort((a, b) => b.total_obligations - a.total_obligations).slice(0, 50);

    const subtitle = d3.select("#institutions-subtitle");
    if (stateLabel) {
      subtitle.html("");
      subtitle.append("span").text(`${stateLabel}, FY${year}`);
      subtitle.append("button").text("clear").on("click", () => { selectedFips = null; render(); });
    } else {
      subtitle.text(`Nationwide, FY${year} · top 50 of ${TOP_N_INSTITUTIONS} tracked`);
    }

    const list = d3.select("#institutions-list");
    list.html("");

    if (ranked.length === 0) {
      list.append("div").attr("class", "inst-loc").text("No tracked institutions for this selection.");
      return;
    }

    const row = list.selectAll(".inst-row").data(ranked, d => d.uei).join("div").attr("class", "inst-row")
      .on("click", (event, d) => { selectedUei = d.uei; render(); });
    row.append("div").attr("class", "inst-rank").text((d, i) => i + 1);
    const nameWrap = row.append("div").attr("class", "inst-name-wrap");
    nameWrap.append("div").attr("class", "inst-name").attr("title", d => d.name).text(d => titleCase(d.name));
    nameWrap.append("div").attr("class", "inst-loc").text(d => `${titleCase(d.city)}, ${d.state_code}`);
    const amountWrap = row.append("div");
    amountWrap.append("div").attr("class", "inst-amount").text(d => `$${d.total_obligations.toLocaleString(undefined, {maximumFractionDigits: 0})}`);
    amountWrap.append("div").attr("class", "inst-awards").text(d => `${d.award_count.toLocaleString()} awards`);
  }

  function renderInstitutionDetail(uei, agency) {
    const meta = institutionRows.find(d => d.uei === uei);
    const subtitle = d3.select("#institutions-subtitle");
    subtitle.html("");

    const list = d3.select("#institutions-list");
    list.html("");

    const back = list.append("button").attr("id", "detail-back").text("← back to list");
    back.on("click", () => { selectedUei = null; render(); });

    list.append("div").attr("class", "detail-name").text(titleCase(meta ? meta.name : uei));
    if (meta) list.append("div").attr("class", "detail-loc").text(`${titleCase(meta.city)}, ${meta.state_code}`);

    const fundingByYear = institutionRows
      .filter(d => d.uei === uei && (agency === "__all__" || d.agency === agency))
      .reduce((acc, d) => { acc.set(d.fiscal_year, (acc.get(d.fiscal_year) || 0) + d.total_obligations); return acc; }, new Map());
    const fundingSeries = years.map(y => ({ year: y, value: fundingByYear.get(y) || 0 }));

    const outputSeries = outputRows.filter(d => d.uei === uei).sort((a, b) => a.fiscal_year - b.fiscal_year)
      .map(d => ({ year: d.fiscal_year, value: d.works_count }));
    const citationSeries = outputRows.filter(d => d.uei === uei).sort((a, b) => a.fiscal_year - b.fiscal_year)
      .map(d => ({ year: d.fiscal_year, value: d.cited_by_count }));

    list.append("div").attr("class", "detail-section-title").text("Funding by year (selected agency)");
    barChart(list.append("div"), fundingSeries, d => `$${d.value.toLocaleString(undefined, {maximumFractionDigits: 0})}`);

    list.append("div").attr("class", "detail-section-title").text("Papers published by year (OpenAlex, all sources)");
    barChart(list.append("div"), outputSeries, d => d.value.toLocaleString());

    list.append("div").attr("class", "detail-section-title").text("Citations to those papers, by publication year");
    barChart(list.append("div"), citationSeries, d => d.value.toLocaleString());
    list.append("div").attr("class", "chart-caveat")
      .text("Recent years look lower because papers need time to accumulate citations - this is a lag artifact, not declining impact.");

    const allFields = fieldMixRows.filter(d => d.uei === uei);
    const fields = allFields.slice().sort((a, b) => b.share - a.share).slice(0, 8);
    const maxShare = fields.length ? fields[0].share : 1;
    list.append("div").attr("class", "detail-section-title").text("Research field mix (OpenAlex, all-time)");
    const fieldList = list.append("div");
    const fieldRow = fieldList.selectAll(".field-row").data(fields).join("div").attr("class", "field-row");
    fieldRow.append("div").attr("class", "field-name").attr("title", d => d.field_name).text(d => d.field_name);
    const track = fieldRow.append("div").attr("class", "field-bar-track");
    track.append("div").attr("class", "field-bar-fill").style("width", d => `${(d.share / maxShare) * 100}%`);
    fieldRow.append("div").attr("class", "field-pct").text(d => `${(d.share * 100).toFixed(0)}%`);

    if (fields.length === 0) {
      fieldList.append("div").attr("class", "inst-loc").text("No OpenAlex field data available.");
    } else {
      fieldList.append("div").attr("class", "chart-caveat")
        .text("Shares are of total output; OpenAlex tracks only each institution's ~25 most significant topics, so these don't sum to 100%.");
    }
  }

  function barChart(container, series, labelFn) {
    const w = 300, h = 46, barGap = 2;
    const max = d3.max(series, d => d.value) || 1;
    const barW = series.length ? (w - barGap * (series.length - 1)) / series.length : w;
    const svg = container.append("svg").attr("width", "100%").attr("viewBox", `0 0 ${w} ${h + 12}`);
    const g = svg.selectAll("g").data(series).join("g")
      .attr("transform", (d, i) => `translate(${i * (barW + barGap)}, 0)`);
    g.append("rect")
      .attr("y", d => h - (d.value / max) * h)
      .attr("width", barW)
      .attr("height", d => Math.max(1, (d.value / max) * h))
      .attr("fill", "var(--accent)")
      .attr("opacity", 0.85)
      .append("title").text(d => `FY${d.year}: ${labelFn(d)}`);
    g.append("text")
      .attr("y", h + 10)
      .attr("font-size", 7)
      .attr("fill", "var(--muted)")
      .attr("text-anchor", "middle")
      .attr("transform", `translate(${barW / 2}, 0)`)
      .text(d => `'${String(d.year).slice(2)}`);
  }

  function titleCase(s) {
    return (s || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  agencySelect.on("change", render);
  yearRange.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
